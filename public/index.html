<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pivot Medical Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="login" id="login" hidden>
  <form class="loginbox" data-form="login" novalidate>
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="currentColor"/><path d="M14 8h6v6h6v6h-6v6h-6v-6H8v-6h6z" fill="var(--surface)"/></svg>
      <div><b>Pivot</b><span>Medical Centre</span></div>
    </div>
    <h1>Staff sign in</h1>
    <p class="note" id="loginmsg"></p>
    <label>Username<input class="field" id="l-user" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
    <label>Password<input class="field" id="l-pass" type="password" autocomplete="current-password"></label>
    <div class="err" id="loginerr"></div>
    <button class="btn primary" id="l-btn" type="submit">Sign in</button>
    <p class="note">Authorised staff only. Sign-ins and changes are recorded.</p>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect width="34" height="34" rx="8" fill="currentColor"/><path d="M14 8h6v6h6v6h-6v6h-6v-6H8v-6h6z" fill="var(--surface)"/></svg>
      <div><b>Pivot</b><span>Medical Centre</span></div>
    </div>
    <nav class="nav" aria-label="Sections" id="nav"></nav>
    <div class="side-foot" id="sidefoot"></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div id="toast" role="status" aria-live="polite"><span id="toastmsg"></span></div>
<script src="/app.js"></script>
</body>
</html>
